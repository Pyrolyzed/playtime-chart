[plugin]
id = "com.pyro.playtimechart"
name = "Playtime Chart"
version = "1.0.0"
author = "Pyro"
description = "Tracks every play session (start, end, length, date) and shows them as Gantt charts, aggregate stats and a playtime pie chart."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
padding = 0
backend_prefix  = "BCK"
frontend_prefix = "FRT"
